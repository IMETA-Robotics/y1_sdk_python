right_master_arm:
  ros__parameters:
    # CAN ID 
    arm_can_id: 'can0'
    # arm status and joint state feedback frequency (HZ) 
    arm_feedback_rate: 400
    # arm control type: leader_arm(remote master arm), follower_arm(remote slave arm), normal_arm(normal control arm) 
    arm_control_type: 'leader_arm'
    # 0: nothing, 1: gripper, 2: teaching pendant, 3: gripper and teaching pendant
    arm_end_type: 3
    # whether to enable robotic arm 
    auto_enable: true
    # 夹爪力反馈开关，需要从臂同时也开启此标志位
    gripper_force_feedback_enable: true
    # 夹抓反馈力度，默认10，范围0-10
    gripper_force_feedback_gain: 10
    # 从臂交互力反馈话题
    slave_arm_interaction_topic: '/y1/slave_arm_interaction'
    # end pose and joint position feedback 
    arm_joint_state_topic: '/master_arm_right/joint_states'
    # joint motor status feedback 
    arm_status_topic: '/master_arm_right/arm_status'

right_slave_arm:
  ros__parameters:
    # CAN ID 
    arm_can_id: 'can1'
    # arm status and joint state feedback frequency (HZ) 
    arm_feedback_rate: 400
    # arm control type: leader_arm(remote master arm), follower_arm(remote slave arm), normal_arm(normal control arm) 
    arm_control_type: 'follower_arm'
    # 0: nothing, 1: gripper, 2: teaching pendant, 3: gripper and teaching pendant
    arm_end_type: 3
    # whether to enable robotic arm 
    auto_enable: true
    # joint position control arm 
    arm_joint_position_control_topic: '/master_arm_right/joint_states'
    # 夹爪力反馈开关，需要主臂同时也开启此标志位
    gripper_force_feedback_enable: true
    # gripper_force_feedback_gain: 10
    # 从臂交互力反馈话题
    slave_arm_interaction_topic: '/y1/slave_arm_interaction'
    # end pose and joint position feedback 
    arm_joint_state_topic: '/puppet_arm_right/joint_states'
    # joint motor status feedback 
    arm_status_topic: '/puppet_arm_right/arm_status'